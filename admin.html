<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡密管理后台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d0c08;color:#f0e8cc;min-height:100vh;}
.container{max-width:800px;margin:0 auto;padding:20px;}
h1{text-align:center;color:#d4b058;margin:30px 0;font-size:24px;}
.login-box{background:linear-gradient(145deg,rgba(39,36,24,0.95),rgba(20,18,12,0.98));border:1px solid rgba(212,176,88,0.25);border-radius:12px;padding:30px;max-width:400px;margin:100px auto;}
.login-box h2{text-align:center;color:#d4b058;margin-bottom:20px;}
.login-box input{width:100%;padding:12px;background:rgba(20,19,13,0.8);border:1px solid rgba(212,176,88,0.3);border-radius:8px;color:#f0e8cc;font-size:16px;margin-bottom:15px;}
.login-box button{width:100%;padding:12px;background:linear-gradient(135deg,#d4b058,#b8943f);border:none;border-radius:8px;color:#1a1810;font-size:16px;font-weight:bold;cursor:pointer;}
.panel{display:none;}
.panel.active{display:block;}
.generate-box{background:linear-gradient(145deg,rgba(39,36,24,0.95),rgba(20,18,12,0.98));border:1px solid rgba(212,176,88,0.25);border-radius:12px;padding:25px;margin-bottom:20px;}
.generate-box h3{color:#d4b058;margin-bottom:15px;}
.form-row{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap;}
.form-row select,.form-row input{flex:1;min-width:120px;padding:10px;background:rgba(20,19,13,0.8);border:1px solid rgba(212,176,88,0.3);border-radius:8px;color:#f0e8cc;font-size:14px;}
.form-row button{padding:10px 20px;background:linear-gradient(135deg,#d4b058,#b8943f);border:none;border-radius:8px;color:#1a1810;font-weight:bold;cursor:pointer;white-space:nowrap;}
.cards-list{background:linear-gradient(145deg,rgba(39,36,24,0.95),rgba(20,18,12,0.98));border:1px solid rgba(212,176,88,0.25);border-radius:12px;padding:20px;max-height:500px;overflow-y:auto;}
.cards-list h3{color:#d4b058;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center;}
.cards-list h3 button{font-size:12px;padding:5px 10px;background:rgba(212,176,88,0.2);border:1px solid rgba(212,176,88,0.4);border-radius:5px;color:#d4b058;cursor:pointer;}
.card-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(20,19,13,0.5);border-radius:6px;margin-bottom:5px;font-size:13px;font-family:monospace;}
.card-item .key{color:#f0e8cc;}
.card-item .type{color:#8a7d5a;font-size:11px;}
.card-item .status{font-size:11px;padding:2px 8px;border-radius:4px;}
.status.unused{background:rgba(46,204,113,0.2);color:#2ecc71;}
.status.used{background:rgba(231,76,60,0.2);color:#e74c3c;}
.stats{display:flex;gap:15px;margin-bottom:20px;flex-wrap:wrap;}
.stat-box{flex:1;min-width:100px;background:linear-gradient(145deg,rgba(39,36,24,0.95),rgba(20,18,12,0.98));border:1px solid rgba(212,176,88,0.25);border-radius:10px;padding:15px;text-align:center;}
.stat-box .num{font-size:24px;font-weight:bold;color:#d4b058;}
.stat-box .label{font-size:12px;color:#8a7d5a;margin-top:5px;}
.logout{position:absolute;top:20px;right:20px;padding:8px 15px;background:rgba(231,76,60,0.2);border:1px solid rgba(231,76,60,0.4);border-radius:6px;color:#e74c3c;cursor:pointer;font-size:13px;}
.tab-btn{padding:10px 20px;background:rgba(20,19,13,0.8);border:1px solid rgba(212,176,88,0.3);border-radius:8px;color:#8a7d5a;cursor:pointer;font-size:14px;transition:all 0.2s;}
.tab-btn:hover{border-color:rgba(212,176,88,0.6);color:#d4b058;}
.tab-btn.active{background:linear-gradient(135deg,#d4b058,#b8943f);color:#1a1810;font-weight:bold;border-color:#d4b058;}
.msg{text-align:center;padding:10px;border-radius:6px;margin-bottom:15px;display:none;}
.msg.success{background:rgba(46,204,113,0.2);color:#2ecc71;display:block;}
.msg.error{background:rgba(231,76,60,0.2);color:#e74c3c;display:block;}
.new-cards{background:rgba(46,204,113,0.1);border:1px solid rgba(46,204,113,0.3);border-radius:8px;padding:15px;margin-top:15px;display:none;}
.new-cards h4{color:#2ecc71;margin-bottom:10px;}
.new-cards textarea{width:100%;height:150px;background:rgba(0,0,0,0.3);border:1px solid rgba(46,204,113,0.3);border-radius:6px;color:#2ecc71;padding:10px;font-family:monospace;font-size:12px;resize:none;}
</style>
</head>
<body>
<div class="container">
    <!-- 登录页 -->
    <div id="loginPanel" class="panel active">
        <div class="login-box">
            <h2>卡密管理后台</h2>
            <div id="loginMsg" class="msg"></div>
            <input type="password" id="adminPwd" placeholder="请输入管理员密码" onkeydown="if(event.key==='Enter')doLogin()">
            <button onclick="doLogin()">登 录</button>
        </div>
    </div>

    <!-- 管理面板 -->
    <div id="adminPanel" class="panel">
        <button class="logout" onclick="doLogout()">退出</button>
        <h1>卡密管理后台</h1>

        <div class="stats" id="stats"></div>

        <div style="display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap;">
            <button onclick="switchTab('generate')" id="btn-generate" class="tab-btn active">生成卡密</button>
            <button onclick="switchTab('renew')" id="btn-renew" class="tab-btn">卡密续费</button>
            <button onclick="switchTab('query')" id="btn-query" class="tab-btn">查询卡密</button>
            <button onclick="switchTab('list')" id="btn-list" class="tab-btn">卡密列表</button>
        </div>

        <div id="tab-generate" class="tab-content">
        <div class="generate-box">
            <h3>生成新卡密</h3>
            <div id="genMsg" class="msg"></div>
            <div class="form-row">
                <select id="cardType">
                    <option value="hours">2小时卡</option>
                    <option value="days_1">1天卡</option>
                    <option value="days_7">7天卡</option>
                    <option value="permanent">永久卡</option>
                </select>
                <input type="number" id="cardCount" value="10" min="1" max="500" placeholder="生成数量">
                <input type="text" id="customSuffix" placeholder="自定义后缀(5位，留空随机)" style="width:160px;" maxlength="5">
                <button onclick="generateCards()">生成卡密</button>
            </div>
            <div class="new-cards" id="newCardsBox">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                    <h4 style="margin:0;">新生成的卡密（纯卡密，直接复制）</h4>
                    <button onclick="copyNewCards()" style="background:rgba(46,204,113,0.2);border:1px solid rgba(46,204,113,0.4);color:#2ecc71;border-radius:4px;padding:4px 12px;cursor:pointer;font-size:12px;">一键复制全部</button>
                </div>
                <textarea id="newCardsText" readonly></textarea>
            </div>
        </div>
        </div>

        <div id="tab-renew" class="tab-content" style="display:none;">
        <div class="generate-box">
            <h3>卡密续费</h3>
            <div id="renewMsg" class="msg"></div>
            <div class="form-row">
                <input type="text" id="renewKey" placeholder="输入要续费的卡密" style="flex:2;">
                <select id="renewType">
                    <option value="hours">续2小时</option>
                    <option value="days_1">续1天</option>
                    <option value="days_7">续7天</option>
                    <option value="permanent">续永久（9999天）</option>
                </select>
                <button onclick="renewCard()">续费</button>
            </div>
        </div>
        </div>

        <div id="tab-query" class="tab-content" style="display:none;">
        <div class="generate-box">
            <h3>查询卡密</h3>
            <div id="queryMsg" class="msg"></div>
            <div class="form-row">
                <input type="text" id="queryKey" placeholder="输入要查询的卡密" style="flex:2;" onkeydown="if(event.key==='Enter')queryCard()">
                <button onclick="queryCard()">查询</button>
            </div>
            <div id="queryResult" style="display:none;background:rgba(20,19,13,0.5);border-radius:8px;padding:15px;margin-top:10px;font-size:13px;line-height:1.8;"></div>
        </div>
        </div>

        <div id="tab-list" class="tab-content" style="display:none;">
        <div class="cards-list">
            <h3>卡密列表 <button onclick="loadCards()">刷新</button></h3>
            <div id="cardsList"></div>
        </div>
        </div>
    </div>
</div>
