<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEMON - 验证</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:#0a0a0a;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;}
.bg{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center,#1a0000 0%,#0a0a0a 70%);z-index:0;}
.particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;}
.auth-box{position:relative;z-index:2;background:rgba(20,18,13,0.9);backdrop-filter:blur(20px);border:1px solid rgba(212,176,88,0.3);border-radius:20px;padding:40px 35px;width:90%;max-width:380px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5);}
.auth-icon{font-size:48px;margin-bottom:15px;}
.auth-title{font-size:24px;font-weight:bold;color:#d4b058;margin-bottom:8px;letter-spacing:2px;}
.auth-sub{font-size:13px;color:#8a7d5a;margin-bottom:25px;}
.auth-input{width:100%;padding:14px 16px;background:rgba(0,0,0,0.4);border:1px solid rgba(212,176,88,0.3);border-radius:10px;color:#d4b058;font-size:16px;text-align:center;letter-spacing:2px;margin-bottom:15px;outline:none;transition:0.3s;}
.auth-input:focus{border-color:rgba(212,176,88,0.7);box-shadow:0 0 15px rgba(212,176,88,0.2);}
.auth-btn{width:100%;padding:14px;background:linear-gradient(135deg,#d4b058,#b8943f);color:#1a1810;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;transition:0.3s;letter-spacing:4px;}
.auth-btn:hover{transform:translateY(-2px);box-shadow:0 5px 20px rgba(212,176,88,0.3);}
.auth-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
.auth-err{color:#e74c3c;font-size:13px;margin-top:15px;min-height:18px;}
.auth-qq{margin-top:20px;font-size:12px;color:#666;}
.auth-qq span{color:#d4b058;}
.loading{display:none;margin-top:15px;color:#d4b058;font-size:13px;}
.version{position:fixed;bottom:10px;right:10px;font-size:10px;color:#333;z-index:2;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="bg"></div>
<canvas class="particles" id="pCanvas"></canvas>
<div class="auth-box">
<div class="auth-icon">🎮</div>
<div class="auth-title">俱乐部大玩家</div>
<div class="auth-sub">请输入激活密码以使用</div>
<input type="text" class="auth-input" id="authInput" placeholder="请输入卡密" maxlength="32" autocomplete="off">
<button class="auth-btn" id="authBtn" onclick="doAuth()">激 活</button>
<div class="auth-err" id="authErr"></div>
<div class="loading" id="loading">正在验证并加载系统...</div>
<div class="auth-qq">获取密码请联系 <span>QQ：3676023445</span></div>
</div>
<div class="version">v2.0.1</div>
<script>
var VERSION = '2.0.1';
var SUPABASE_URL = 'https://xrfzqlwrkidsblxofevj.supabase.co';
var SUPABASE_KEY = 'sb_publishable_9l8AW-w--GORou1AaAD95g_TOQrQ-0f';
var supabaseClient = null;

// 等supabase库加载完再初始化
function initSupabase() {
  if (window.supabase && window.supabase.createClient) {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  } else {
    setTimeout(initSupabase, 100);
  }
}
initSupabase();

// 粒子背景
const canvas = document.getElementById('pCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
const particles = [];
for(let i=0;i<40;i++){particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*2+0.5,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,a:Math.random()*0.5+0.2});}
function drawP(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(212,176,88,'+p.a+')';ctx.fill();});requestAnimationFrame(drawP);}
drawP();
window.addEventListener('resize',()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;});

// 设备ID
function getDeviceId(){
  let id = localStorage.getItem('_cd_id');
  if(id) return id;
  const info = [navigator.userAgent,screen.width+'x'+screen.height,screen.colorDepth,Intl.DateTimeFormat().resolvedOptions().timeZone,navigator.language].join('|');
  let h=0;for(let i=0;i<info.length;i++){h=((h<<5)-h)+info.charCodeAt(i);h|=0;}
  id='D'+Math.abs(h).toString(36).toUpperCase();
  localStorage.setItem('_cd_id',id);
  return id;
}

document.getElementById('authInput').addEventListener('keydown',e=>{if(e.key==='Enter')doAuth();});

async function doAuth(){
  const key = document.getElementById('authInput').value.trim().toUpperCase();
  const err = document.getElementById('authErr');
  const btn = document.getElementById('authBtn');
  const loading = document.getElementById('loading');
  if(!supabaseClient){err.innerText='系统加载中，请稍候再试';return;}
  if(!key){err.innerText='请输入卡密';return;}
  btn.disabled=true;btn.innerText='验证中...';err.innerText='';loading.style.display='block';
  try{
    const deviceId = getDeviceId();
    const { data, error } = await supabaseClient.rpc('get_calculator', {
      p_card_key: key,
      p_device_id: deviceId,
      p_version: VERSION
    });
    if(error) throw error;
    const result = data[0];
    if(!result.success){
      err.innerText = result.message || '验证失败';
      btn.disabled=false;btn.innerText='激 活';loading.style.display='none';
      return;
    }
    if(result.need_update){
      err.innerText = '版本过低，请更新到最新版本';
      btn.disabled=false;btn.innerText='激 活';loading.style.display='none';
      return;
    }
    // 验证通过，写入计算器代码
    localStorage.setItem('_cd_act',JSON.stringify({h:key,dev:deviceId,at:Date.now(),exp:result.expires_at}));
    document.open();
    document.write(result.code);
    document.close();
  }catch(e){
    err.innerText='网络错误，请重试';
    btn.disabled=false;btn.innerText='激 活';loading.style.display='none';
  }
}

// 防破解（调试时先注释掉）
// document.addEventListener('contextmenu',e=>e.preventDefault());
// document.addEventListener('keydown',e=>{
//   if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='J'))||(e.ctrlKey&&(e.key==='u'||e.key==='U'))){e.preventDefault();}
// });
</script>
</body>
</html>
