<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEMON - 恶魔系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    background: url('https://images.unsplash.com/photo-1518709268805-4e9042af2176?w=1920') center/cover no-repeat fixed;
    position: relative;
    overflow-x: hidden;
    color: #fff;
}
body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(135deg, rgba(20,0,0,0.75) 0%, rgba(40,0,20,0.65) 50%, rgba(0,0,0,0.8) 100%);
    z-index: 0;
}
.container {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
}
.main-card {
    display: flex;
    gap: 40px;
    max-width: 1100px;
    width: 100%;
    flex-wrap: wrap;
    justify-content: center;
}
/* 左侧 */
.left-side {
    flex: 1;
    min-width: 320px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}
.avatar-area {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 30px;
}
.avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8b0000, #dc143c);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    border: 3px solid rgba(220,20,60,0.5);
    box-shadow: 0 0 30px rgba(220,20,60,0.4);
    animation: glow 2s ease-in-out infinite alternate;
}
@keyframes glow {
    from { box-shadow: 0 0 20px rgba(220,20,60,0.3); }
    to { box-shadow: 0 0 40px rgba(220,20,60,0.6); }
}
.title-area h1 {
    font-size: 48px;
    font-weight: 900;
    background: linear-gradient(135deg, #ff4444, #ff6b6b, #dc143c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 3px;
}
.title-area p {
    color: rgba(255,255,255,0.6);
    font-size: 14px;
    margin-top: 5px;
    letter-spacing: 2px;
}
.quote-box {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 25px 30px;
    margin-bottom: 25px;
    position: relative;
}
.quote-box::before {
    content: '"';
    position: absolute;
    top: 5px; left: 15px;
    font-size: 40px;
    color: rgba(220,20,60,0.5);
    font-family: Georgia, serif;
}
.quote-box::after {
    content: '"';
    position: absolute;
    bottom: -10px; right: 20px;
    font-size: 40px;
    color: rgba(220,20,60,0.5);
    font-family: Georgia, serif;
}
.quote-text {
    font-size: 16px;
    line-height: 1.8;
    color: rgba(255,255,255,0.85);
    font-style: italic;
    padding-left: 20px;
}
.quote-author {
    text-align: right;
    color: #dc143c;
    font-size: 13px;
    margin-top: 10px;
}
.social-icons {
    display: flex;
    gap: 15px;
}
.social-icons a {
    width: 42px;
    height: 42px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: #fff;
    font-size: 18px;
    transition: all 0.3s;
}
.social-icons a:hover {
    background: rgba(220,20,60,0.3);
    transform: translateY(-3px);
}
/* 右侧 */
.right-side {
    flex: 1;
    min-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}
.time-card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 25px;
    text-align: center;
}
.time-card .date {
    font-size: 14px;
    color: rgba(255,255,255,0.6);
    margin-bottom: 8px;
}
.time-card .time {
    font-size: 42px;
    font-weight: 700;
    letter-spacing: 3px;
    background: linear-gradient(135deg, #ff4444, #ff6b6b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.time-card .greeting {
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    margin-top: 8px;
}
.enter-btn {
    display: block;
    width: 100%;
    padding: 20px;
    background: linear-gradient(135deg, #8b0000, #dc143c);
    border: none;
    border-radius: 16px;
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 4px;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    transition: all 0.3s;
    box-shadow: 0 5px 25px rgba(220,20,60,0.4);
}
.enter-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 35px rgba(220,20,60,0.6);
}
.enter-btn .sub {
    display: block;
    font-size: 12px;
    font-weight: 400;
    opacity: 0.7;
    margin-top: 5px;
    letter-spacing: 2px;
}
.nav-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}
.nav-item {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 18px;
    text-align: center;
    text-decoration: none;
    color: #fff;
    transition: all 0.3s;
    cursor: pointer;
}
.nav-item:hover {
    background: rgba(220,20,60,0.2);
    transform: translateY(-2px);
}
.nav-item .icon {
    font-size: 24px;
    margin-bottom: 8px;
}
.nav-item .label {
    font-size: 13px;
    color: rgba(255,255,255,0.8);
}
.footer {
    position: fixed;
    bottom: 15px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    z-index: 1;
}
@media (max-width: 768px) {
    .title-area h1 { font-size: 36px; }
    .time-card .time { font-size: 32px; }
    .main-card { gap: 25px; }
}
</style>
</head>
<body>
<div class="container">
    <div class="main-card">
        <!-- 左侧 -->
        <div class="left-side">
            <div class="avatar-area">
                <div class="avatar">😈</div>
                <div class="title-area">
                    <h1>DEMON</h1>
                    <p>恶魔系统 · 私人定制</p>
                </div>
            </div>
            <div class="quote-box">
                <div class="quote-text" id="quoteText">当你凝视深渊时，深渊也在凝视你。</div>
                <div class="quote-author">—— 尼采</div>
            </div>
            <div class="social-icons">
                <a href="#" title="QQ">💬</a>
                <a href="#" title="微信">📱</a>
                <a href="#" title="邮箱">📧</a>
                <a href="#" title="Telegram">✈️</a>
            </div>
        </div>
        <!-- 右侧 -->
        <div class="right-side">
            <div class="time-card">
                <div class="date" id="dateText">2026年08月27日 星期四</div>
                <div class="time" id="timeText">00:00:00</div>
                <div class="greeting" id="greetingText">欢迎来到恶魔的领域</div>
            </div>
            <a href="verify.html" class="enter-btn">
                进入系统
                <span class="sub">ENTER THE DEMON SYSTEM</span>
            </a>
            <div class="nav-grid">
                <a href="https://shop.368fk.cn/shop/FUCWGU1F" target="_blank" class="nav-item">
                    <div class="icon">🎫</div>
                    <div class="label">购买卡密</div>
                </a>
                <div class="nav-item" onclick="showMsg('使用教程：输入卡密→激活→开始使用')">
                    <div class="icon">📖</div>
                    <div class="label">使用教程</div>
                </div>
                <div class="nav-item" onclick="showMsg('问题反馈请联系管理员QQ：3676023445')">
                    <div class="icon">🛠️</div>
                    <div class="label">问题反馈</div>
                </div>
                <div class="nav-item" onclick="showMsg('本产品为私人定制版本，禁止破解和传播')">
                    <div class="icon">⚠️</div>
                    <div class="label">免责声明</div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="footer">© 2026 DEMON System · 私人定制版本 · 管理员QQ：3676023445 · 禁止破解传播</div>

<script>
// 时间更新
function updateTime() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    document.getElementById('timeText').textContent = h + ':' + m + ':' + s;
    
    const week = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
    const dateStr = now.getFullYear() + '年' + String(now.getMonth()+1).padStart(2,'0') + '月' + String(now.getDate()).padStart(2,'0') + '日 ' + week[now.getDay()];
    document.getElementById('dateText').textContent = dateStr;
    
    const hour = now.getHours();
    let greet = '';
    if (hour < 6) greet = '夜深了，恶魔还在等你';
    else if (hour < 12) greet = '早安，欢迎来到恶魔的领域';
    else if (hour < 14) greet = '午安，休息一下吧';
    else if (hour < 18) greet = '下午好，准备好战斗了吗';
    else if (hour < 22) greet = '晚上好，恶魔已苏醒';
    else greet = '夜深了，恶魔与你同在';
    document.getElementById('greetingText').textContent = greet;
}
updateTime();
setInterval(updateTime, 1000);

// 随机名言
const quotes = [
    { text: '当你凝视深渊时，深渊也在凝视你。', author: '—— 尼采' },
    { text: '地狱空荡荡，恶魔在人间。', author: '—— 莎士比亚' },
    { text: '与其在天堂为奴，不如在地狱为王。', author: '—— 弥尔顿' },
    { text: '恶魔之所以为恶魔，是因为他曾被天使背叛。', author: '—— 佚名' },
    { text: '黑暗给了我黑色的眼睛，我却用它寻找光明。', author: '—— 顾城' }
];
const q = quotes[Math.floor(Math.random() * quotes.length)];
document.getElementById('quoteText').textContent = q.text;
document.querySelector('.quote-author').textContent = q.author;

function showMsg(msg) {
    alert(msg);
}
</script>
</body>
</html>
