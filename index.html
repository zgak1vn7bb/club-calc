<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMON - 恶魔系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body, html { height: 100%; overflow: hidden; }
        .bg {
            position: absolute;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #0a0000 0%, #1a0000 25%, #0d0d0d 50%, #1a0000 75%, #0a0000 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .bg-overlay {
            position: absolute;
            width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(139,0,0,0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(139,0,0,0.2) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(212,176,88,0.05) 0%, transparent 70%);
        }
        .particles {
            position: absolute;
            width: 100%; height: 100%;
            overflow: hidden;
            z-index: 0;
        }
        .particle {
            position: absolute;
            width: 2px; height: 2px;
            background: rgba(212,176,88,0.6);
            border-radius: 50%;
            animation: float 8s infinite ease-in-out;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(20px); opacity: 0; }
        }
        .container {
            position: relative;
            width: 100%; height: 100%;
            display: flex;
            justify-content: space-between;
            padding: 40px 60px;
            color: white;
            z-index: 1;
        }
        .left {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 35%;
        }
        .logo-area { display: flex; align-items: center; gap: 20px; margin-top: 100px; }
        .logo {
            width: 80px; height: 80px; border-radius: 50%;
            border: 2px solid rgba(212,176,88,0.5);
            background: linear-gradient(135deg, #1a1a1a, #2d0000);
            display: flex; align-items: center; justify-content: center;
            font-size: 40px; color: #d4b058;
        }
        .logo-title {
            font-size: 50px; font-weight: bold; letter-spacing: 4px;
            background: linear-gradient(135deg, #d4b058, #8b0000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .quote-area {
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            border-radius: 10px; padding: 20px; width: 90%;
            border: 1px solid rgba(212,176,88,0.2);
        }
        .quote-area h3 { margin-bottom: 10px; font-weight: normal; line-height: 1.6; }
        .social-icons { display: flex; gap: 20px; margin-top: 20px; font-size: 24px; }
        .social-icons i { color: #d4b058; cursor: pointer; transition: 0.3s; }
        .social-icons i:hover { color: #8b0000; transform: scale(1.2); }
        .right {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            width: 60%;
            gap: 30px;
        }
        .top-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
        .top-badge {
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            padding: 8px 15px; border-radius: 20px; font-size: 14px;
            display: flex; align-items: center; gap: 8px;
            border: 1px solid rgba(212,176,88,0.2);
        }
        .center-right { display: flex; justify-content: center; margin-top: 60px; }
        .glass-card {
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            border-radius: 10px; padding: 30px;
            border: 1px solid rgba(212,176,88,0.2);
        }
        .date-time { width: 80%; text-align: center; }
        .time {
            font-size: 56px; font-weight: bold; letter-spacing: 4px;
            margin-top: 15px; color: #d4b058;
        }
        .weather-msg { font-size: 12px; color: #888; margin-top: 5px; }
        .websites-title {
            display: flex; align-items: center; gap: 10px;
            font-size: 16px; margin-bottom: 15px; color: #d4b058;
        }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .grid-item {
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            border: 1px solid rgba(212,176,88,0.3); border-radius: 12px;
            padding: 35px 30px; display: flex; align-items: center; gap: 20px;
            cursor: pointer; transition: 0.3s; text-decoration: none; color: white;
            font-size: 22px; font-weight: bold;
        }
        .grid-item:hover {
            background: rgba(139,0,0,0.4);
            border-color: rgba(212,176,88,0.6);
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(139,0,0,0.3);
        }
        .grid-icon { font-size: 36px; color: #d4b058; }
        .footer {
            text-align: center; padding: 10px;
            color: rgba(212,176,88,0.5); font-size: 12px;
        }
        .game-btn {
            display: block; margin: 0 auto;
            background: rgba(139,0,0,0.3);
            border: 1px solid rgba(212,176,88,0.4);
            color: #d4b058; border-radius: 25px;
            padding: 12px 30px; cursor: pointer;
            font-size: 16px; transition: 0.3s;
        }
        .game-btn:hover {
            background: rgba(139,0,0,0.6);
            transform: scale(1.05);
        }
        .game-modal {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 100;
            justify-content: center; align-items: center;
        }
        .game-modal.active { display: flex; }
        .game-box {
            background: linear-gradient(135deg, #1a0000, #0d0d0d);
            border: 2px solid rgba(212,176,88,0.4);
            border-radius: 15px; padding: 25px;
            width: 90%; max-width: 500px;
            text-align: center; color: white;
        }
        .game-box h3 { color: #d4b058; margin-bottom: 15px; }
        .game-info { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 16px; }
        #gameCanvas {
            background: #0a0000; border: 1px solid rgba(212,176,88,0.3);
            border-radius: 8px; cursor: crosshair;
        }
        .game-close {
            margin-top: 15px; background: rgba(231,76,60,0.3);
            border: 1px solid rgba(231,76,60,0.5);
            color: #e74c3c; border-radius: 6px;
            padding: 8px 20px; cursor: pointer;
        }
        @media (max-width: 1000px) {
            .container { flex-direction: column; padding: 20px; overflow-y: auto; }
            .left, .right { width: 100%; }
            .grid { grid-template-columns: 1fr; }
            .logo-title { font-size: 36px; }
            .time { font-size: 28px; }
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="bg-overlay"></div>
    <div class="particles" id="particles"></div>
    <div class="container">
        <div class="left">
            <div class="logo-area">
                <div class="logo"><i class="fa-solid fa-skull"></i></div>
                <div class="logo-title">DEMON</div>
            </div>
            <div class="quote-area">
                <h3><i class="fa-solid fa-quote-left" style="color:#8b0000;"></i> 恶魔降临，谁与争锋 <br> 精准估算，掌控全场 <i class="fa-solid fa-quote-right" style="color:#8b0000;"></i></h3>
                <div class="social-icons">
                    <a href="tencent://message/?uin=3676023445" style="color:inherit;text-decoration:none;"><i class="fa-brands fa-qq" title="管理员QQ: 3676023445"></i></a>
                </div>
                <p style="margin-top:15px;font-size:12px;color:#888;">管理员QQ：3676023445</p>
            </div>
        </div>
        <div class="right">
            <div class="top-right">
                <div class="top-badge"><i class="fa-solid fa-fire" style="color:#8b0000;"></i> 恶魔系统 v2.0</div>
                <div class="top-badge"><i class="fa-solid fa-circle-info"></i> 欢迎来到恶魔领域</div>
            </div>
            <div class="center-right">
                <div class="glass-card date-time" style="width: 100%; text-align: center;">
                    <p id="date" style="font-size: 14px;">2026年08月27日 星期四</p>
                    <p class="time" id="time">00:00:00</p>
                    <p class="weather-msg">恶魔时刻</p>
                </div>
            </div>
            <button class="game-btn" onclick="openGame()"><i class="fa-solid fa-gamepad"></i> 打恶魔小游戏</button>
            <div class="websites">
                <div class="websites-title"><i class="fa-solid fa-globe"></i> 快速入口</div>
                <div class="grid">
                    <a href="verify.html" class="grid-item">
                        <i class="fa-solid fa-rocket grid-icon"></i>
                        <div>
                            <div>立即进入科技模式</div>
                            <div style="font-size:11px;color:#888;font-weight:normal;margin-top:3px;">科技入口，点击此处</div>
                        </div>
                    </a>
                    <a href="https://shop.368fk.cn/shop/FUCWGU1F" target="_blank" class="grid-item">
                        <i class="fa-solid fa-cart-shopping grid-icon"></i>
                        <div>
                            <div>购买卡密</div>
                            <div style="font-size:11px;color:#888;font-weight:normal;margin-top:3px;">获取授权</div>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>
    <div class="game-modal" id="gameModal">
        <div class="game-box">
            <h3>🎮 打恶魔小游戏</h3>
            <div class="game-info">
                <span>得分: <span id="gameScore">0</span></span>
                <span>时间: <span id="gameTime">30</span>s</span>
            </div>
            <canvas id="gameCanvas" width="450" height="350"></canvas>
            <br>
            <button class="game-close" onclick="closeGame()">关闭</button>
        </div>
    </div>
    <div class="footer">本产品为私人版本，如被破解将追究法律责任 | 管理员QQ: 3676023445</div>
    <script>
        function updateTime() {
            const now = new Date();
            const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const dateStr = `${now.getFullYear()}年${String(now.getMonth() + 1).padStart(2, '0')}月${String(now.getDate()).padStart(2, '0')}日 ${days[now.getDay()]}`;
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
            document.getElementById('date').innerText = dateStr;
            document.getElementById('time').innerText = timeStr;
        }
        setInterval(updateTime, 1000);
        updateTime();
        // 生成浮动粒子
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 50; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.bottom = '-10px';
            p.style.animationDelay = Math.random() * 8 + 's';
            p.style.animationDuration = (5 + Math.random() * 5) + 's';
            p.style.width = p.style.height = (1 + Math.random() * 3) + 'px';
            particlesContainer.appendChild(p);
        }
        // 打恶魔小游戏
        let gameInterval, gameTimer, score = 0, timeLeft = 30, demons = [];
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        function openGame() {
            document.getElementById('gameModal').classList.add('active');
            score = 0; timeLeft = 30; demons = [];
            document.getElementById('gameScore').innerText = score;
            document.getElementById('gameTime').innerText = timeLeft;
            gameInterval = setInterval(spawnDemon, 800);
            gameTimer = setInterval(() => {
                timeLeft--;
                document.getElementById('gameTime').innerText = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);
            drawGame();
        }
        function closeGame() {
            document.getElementById('gameModal').classList.remove('active');
            clearInterval(gameInterval);
            clearInterval(gameTimer);
        }
        function spawnDemon() {
            demons.push({
                x: Math.random() * (canvas.width - 50),
                y: Math.random() * (canvas.height - 50),
                size: 30 + Math.random() * 20,
                life: 60
            });
        }
        function drawGame() {
            ctx.fillStyle = '#0a0000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            demons = demons.filter(d => d.life > 0);
            demons.forEach(d => {
                ctx.font = d.size + 'px Arial';
                ctx.fillText('👹', d.x, d.y + d.size);
                d.life--;
            });
            if (timeLeft > 0) requestAnimationFrame(drawGame);
        }
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            demons.forEach((d, i) => {
                if (x > d.x && x < d.x + d.size && y > d.y && y < d.y + d.size) {
                    score += 10;
                    document.getElementById('gameScore').innerText = score;
                    demons.splice(i, 1);
                }
            });
        });
        function endGame() {
            clearInterval(gameInterval);
            clearInterval(gameTimer);
            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#d4b058';
            ctx.font = '30px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('游戏结束！得分: ' + score, canvas.width/2, canvas.height/2);
        }
    </script>
</body>
</html>
